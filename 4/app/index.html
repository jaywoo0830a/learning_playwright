<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>알림 앱</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; }
    .toast { display: none; padding: 12px 20px; border-radius: 6px; margin-top: 16px; }
    .toast.show { display: block; }
    .toast.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .toast.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    button { padding: 10px 20px; margin-right: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>알림 테스트</h1>
  <button id="btn-success" onclick="showToast('success')">성공 알림</button>
  <button id="btn-error"   onclick="showToast('error')">에러 알림</button>
  <div id="toast-success" class="toast success">저장이 완료되었습니다! ✓</div>
  <div id="toast-error"   class="toast error">오류가 발생했습니다. 다시 시도해주세요.</div>

  <script>
    function showToast(type) {
      // 모든 토스트 숨기기
      document.querySelectorAll('.toast').forEach(el => el.classList.remove('show'));
      // 해당 토스트 보이기
      document.getElementById('toast-' + type).classList.add('show');
      // 3초 후 자동 숨기기
      setTimeout(() => {
        document.getElementById('toast-' + type).classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
